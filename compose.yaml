name: onlyoffice

services:
  postgres:
    image: postgres:18
    container_name: onlyoffice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: onlyoffice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onlyoffice"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data-v18:/var/lib/postgresql

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
    container_name: onlyoffice-rustfs
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY_ID:-folioforms-local}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_ACCESS_KEY:-folioforms-local-secret-change-me}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:9000/health/ready",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rustfs-data:/data

  rustfs-init:
    image: rustfs/rc:v0.1.35@sha256:adb45b56539006120f1d790bcc17ee5f9b4d93c1d7e71ed0a24f10267f9d6914
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY_ID:-folioforms-local}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_ACCESS_KEY:-folioforms-local-secret-change-me}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-folio-forms}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rc alias set local http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY" && rc bucket create "local/$$RUSTFS_BUCKET" --ignore-existing

  onlyoffice:
    image: onlyoffice/documentserver:9.4.0.1
    container_name: onlyoffice
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?set ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
      - onlyoffice-cache:/var/lib/onlyoffice

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: onlyoffice-server
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      onlyoffice:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/onlyoffice
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      EDITOR_CAPABILITY_SECRET: ${EDITOR_CAPABILITY_SECRET:?set EDITOR_CAPABILITY_SECRET}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?set ONLYOFFICE_JWT_SECRET}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:5173
      SERVER_ORIGIN: http://localhost:3000
      API_BASE: http://localhost:3000
      ONLYOFFICE_URL: http://localhost:8080
      ONLYOFFICE_API_BASE: http://localhost:8080
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_DOCUMENT_BASE_URL: http://host.docker.internal:3000
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY_ID:-folioforms-local}
      RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_ACCESS_KEY:-folioforms-local-secret-change-me}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-folio-forms}
      RUSTFS_REGION: us-east-1
      TEMPLATE_PATH: /app/onlyoffice-templates/template.docx
    command: ["sh", "-c", "bun run db:migrate && bun dist/index.mjs"]

volumes:
  postgres-data-v18:
  onlyoffice-data:
  onlyoffice-logs:
  onlyoffice-cache:
  rustfs-data:
